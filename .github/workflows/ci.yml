name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  secrets:
    # Builds in production mode (Supabase adapter) with a fake secret key and
    # checks it never reaches files served to browsers.
    runs-on: ubuntu-latest
    env:
      DATA_ADAPTER: supabase
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fake
      SUPABASE_SECRET_KEY: sb_secret_ci_fake_value_do_not_use
      SESSION_SECRET: ci-fake-session-secret-do-not-use-0123456789
      CRON_SECRET: ci-fake-cron-secret-do-not-use-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node apps/web/scripts/check-client-bundle.mjs

  e2e:
    # Full loop, privacy, wizard, and accessibility checks in a real browser,
    # against a production build with the seeded demo school. No secrets needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lostbox/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
